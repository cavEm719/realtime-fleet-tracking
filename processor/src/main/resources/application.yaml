server:
  port: ${PROCESSOR_PORT:8081}
spring:
  application:
    name: fleet-processor
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/fleet}
    username: ${MYSQL_USER:fleet}
    password: ${MYSQL_PASSWORD:fleet}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 1000
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: fleet-processor
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 300000
    listener:
      poll-timeout: 1000
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

geofence:
  mode: ${GEOFENCE_MODE:hysteresis}
  confirmation-points: ${GEOFENCE_CONFIRMATION_POINTS:3}
  confirmation-time: ${GEOFENCE_CONFIRMATION_TIME:120s}
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
